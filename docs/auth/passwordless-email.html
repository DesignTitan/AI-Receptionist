<!doctype html>
<html lang="en"><body style="font-family:Arial,sans-serif;color:#1d3b34;background:#ffffff;padding:32px">
  <main style="max-width:480px;margin:auto">
    <h1 style="font-size:26px">Your sign-in code</h1>
    <p>Enter this one-time code on the AI Receptionist website to verify your email.</p>
    <p style="font-size:32px;letter-spacing:8px;font-weight:bold">{{ .Token }}</p>
    <p>You can also <a href="{{ .ConfirmationURL }}">sign in securely with this link</a>.</p>
    <p>Only use this code on the website. If you didn’t request it, you can ignore this email.</p>
  </main>
</body></html>
