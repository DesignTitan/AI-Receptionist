<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-industry storyboard — scenes</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#1e3a34;font:16px system-ui}header{padding:25px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce6e0}h1{font-size:22px;margin:0}header small{display:block;color:#637e73;margin-top:5px}main{max-width:1500px;margin:auto;padding:26px 4vw}#hero{width:100%;aspect-ratio:2.25;background-size:200% 300%;background-color:#132b22}nav{display:flex;gap:10px;align-items:center;margin:20px 0}button,a{font:inherit;color:inherit}button{padding:10px 18px;border:1px solid #cddbd3;border-radius:30px;background:white;cursor:pointer}button:hover,button[aria-current=true]{background:#1e3a34;color:white}button:disabled{opacity:.4;cursor:default}#count{margin:auto}#thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:25px 0}#thumbs button{padding:0;overflow:hidden;border-radius:10px;text-align:left}#thumbs .thumb{width:100%;aspect-ratio:2.25;display:block;background-size:200% 300%}#thumbs span{display:block;padding:8px;font-size:12px}#notes{display:grid;grid-template-columns:1fr 1fr;gap:35px;line-height:1.6;border-top:1px solid #dce6e0;padding-top:20px}h2{font-size:25px;margin:0 0 8px}h3{font-size:12px;letter-spacing:1px;text-transform:uppercase}#audio{white-space:pre-line}a{font-size:13px}.status{font-size:13px;color:#637e73;margin:0 0 20px}@media(max-width:700px){#thumbs{grid-template-columns:repeat(3,1fr)}#notes{grid-template-columns:1fr;gap:10px}header{align-items:start;gap:12px}nav{flex-wrap:wrap}button{padding:9px 13px}}:focus-visible{outline:3px solid #5c9d83;outline-offset:3px}</style><header><div><h1>Your business keeps going.</h1><small>Visual storyboard · Draft scenes</small></div><a href="production-notes.html">Production notes ↗</a></header><main><p class="status">Layout matches the earlier storyboard. These draft images precede the character sheets; they are not the final cast or mascot references.</p><div id="hero" role="img"></div><nav aria-label="Scene navigation"><button id="prev" aria-label="Previous scene">← Previous</button><span id="count" aria-live="polite"></span><button id="next" aria-label="Next scene">Next →</button></nav><div id="notes"><div><h2 id="title"></h2><p id="action"></p></div><div><h3>Dialogue / audio</h3><p id="audio"></p></div></div><div id="thumbs" aria-label="All scenes"></div><p><a href="../campaign-v4/#films">← Marketing assets</a></p></main><script>const scenes=[{"number": 1, "image": "/marketing/industries/mascot-transparent.png", "x": 50, "y": 50, "intro": true, "title": "Meet the little voice.", "action": "Opening shot: the mascot sits dead center against near-black forest green, with generous space around it. Hold for about 1.5 seconds: a small blink, a friendly smile, then cut to the groomer as the phone rings. No headline or bubble.", "audio": "A soft opening sound. The incoming ring begins just before the cut. No dialogue."}, {"number": 2, "image": "assets/grooming.png", "x": 0, "y": 0, "title": "Hands full.", "action": "The groomer washes the Samoyed. The phone rings.", "audio": "Natural room sound. No dialogue."}, {"number": 3, "image": "assets/grooming.png", "x": 100, "y": 0, "title": "She can\u2019t pick up.", "action": "Her hands stay with the dog.", "audio": "Natural room sound. No dialogue."}, {"number": 4, "image": "assets/grooming.png", "x": 0, "y": 50, "title": "Someone answers.", "action": "The little mascot pops up and speaks.", "audio": "\u201cHi, Happy Paws. How can I help?\u201d"}, {"number": 5, "image": "assets/grooming.png", "x": 100, "y": 50, "title": "Milo needs a groom.", "action": "At home, the caller has a very unruly little companion.", "audio": "\u201cMilo needs a groom. Thursday afternoon?\u201d"}, {"number": 6, "image": "assets/grooming.png", "x": 0, "y": 100, "title": "A time that works.", "action": "The caller agrees while Milo makes himself the centre of attention.", "audio": "\u201cI have two o\u2019clock.\u201d / \u201cPerfect.\u201d"}, {"number": 7, "image": "assets/grooming.png", "x": 100, "y": 100, "title": "Booked. Back to the dog.", "action": "She keeps working. The caller has her appointment.", "audio": "\u201cMilo\u2019s booked for Thursday at two.\u201d"}, {"number": 8, "image": "assets/salon.png", "x": 0, "y": 0, "title": "A quick sweep into the salon.", "action": "A towel crosses the lens and reveals the next business.", "audio": "Natural room sound. No dialogue."}, {"number": 9, "image": "assets/salon.png", "x": 100, "y": 0, "title": "Mid-blow-dry.", "action": "Brush in one hand, dryer in the other. The mascot answers.", "audio": "\u201cHi, Studio June.\u201d"}, {"number": 10, "image": "assets/salon.png", "x": 0, "y": 50, "title": "A customer calls.", "action": "He wants to find a time for a haircut.", "audio": "\u201cA haircut Friday?\u201d"}, {"number": 11, "image": "assets/salon.png", "x": 100, "y": 50, "title": "Friday works.", "action": "One clear offer, one simple yes.", "audio": "\u201cWould three work?\u201d / \u201cYes, thank you.\u201d"}, {"number": 12, "image": "assets/salon.png", "x": 0, "y": 100, "title": "Keep looking after the client.", "action": "The appointment is booked while the stylist finishes her work.", "audio": "\u201cYou\u2019re booked for Friday at three.\u201d"}, {"number": 13, "image": "assets/salon.png", "x": 100, "y": 100, "title": "Follow the movement.", "action": "The camera sweeps past the mirror into a photography studio.", "audio": "Natural room sound. No dialogue."}, {"number": 14, "image": "assets/photography.png", "x": 0, "y": 0, "title": "The family finally laughs.", "action": "The photographer has both hands on the camera.", "audio": "Natural room sound. No dialogue."}, {"number": 15, "image": "assets/photography.png", "x": 100, "y": 0, "title": "The next family calls.", "action": "A caller asks about a Saturday session.", "audio": "\u201cA family session on Saturday?\u201d"}, {"number": 16, "image": "assets/photography.png", "x": 0, "y": 50, "title": "An easy yes.", "action": "The offered time suits her.", "audio": "\u201cTen o\u2019clock?\u201d / \u201cThat works.\u201d"}, {"number": 17, "image": "assets/photography.png", "x": 100, "y": 50, "title": "The moment is still his.", "action": "The photographer catches the laughter while the booking is handled.", "audio": "\u201cSaturday at ten. You\u2019re booked.\u201d"}, {"number": 18, "image": "assets/photography.png", "x": 0, "y": 100, "title": "Past the studio light.", "action": "The camera passes behind the softbox, hiding the cut.", "audio": "Natural room sound. No dialogue."}, {"number": 19, "image": "assets/photography.png", "x": 100, "y": 100, "title": "Into the workshop.", "action": "We arrive beside a mechanic already occupied with a car.", "audio": "Natural room sound. No dialogue."}, {"number": 20, "image": "assets/mechanic.png", "x": 0, "y": 0, "title": "Both hands on the job.", "action": "The mechanic checks the engine. The mascot takes the call.", "audio": "\u201cHi, Oak Street Auto.\u201d"}, {"number": 21, "image": "assets/mechanic.png", "x": 100, "y": 0, "title": "This one needs a person.", "action": "The caller wants to move an existing appointment.", "audio": "\u201cCan I move tomorrow\u2019s appointment?\u201d"}, {"number": 22, "image": "assets/mechanic.png", "x": 0, "y": 50, "title": "A clear handoff.", "action": "A callback is requested for the team. No false rescheduling confirmation.", "audio": "\u201cI\u2019ll ask the team to call you back.\u201d"}, {"number": 23, "image": "assets/mechanic.png", "x": 100, "y": 50, "title": "Stay with the customer.", "action": "A fresh moment with the groomer and the Samoyed.", "audio": "\u201cStay with the customer in front of you.\u201d"}, {"number": 24, "image": "assets/mechanic.png", "x": 0, "y": 100, "title": "Give the next one a way to reach you.", "action": "The stylist finishes with her client.", "audio": "\u201cGive the next one a way to reach you.\u201d"}, {"number": 25, "image": "assets/mechanic.png", "x": 100, "y": 100, "title": "Meet your AI receptionist.", "action": "The mascot returns for a simple closing invitation.", "audio": "\u201cMeet your AI receptionist.\u201d"}];let active=0;const $=id=>document.getElementById(id);function paint(el,s){el.style.backgroundImage=`url(${s.image})`;el.style.backgroundPosition=`${s.x}% ${s.y}%`;el.style.backgroundSize=s.intro?"auto 55%":"200% 300%";el.style.backgroundRepeat="no-repeat";el.style.backgroundColor=s.intro?"#0b1512":"#132b22";}scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`Scene ${i+1}: ${s.title}`);const thumb=document.createElement('div');thumb.className='thumb';paint(thumb,s);const caption=document.createElement('span');caption.textContent=`${String(i+1).padStart(2,'0')} · ${s.title}`;b.append(thumb,caption);b.onclick=()=>select(i);$('thumbs').append(b)});function render(){const m=location.hash.match(/^#scene-(\d+)$/);active=Math.max(0,Math.min(scenes.length-1,m?Number(m[1])-1:0));const s=scenes[active];paint($('hero'),s);$('hero').setAttribute('aria-label',s.action);$('title').textContent=s.title;$('action').textContent=s.action;$('audio').textContent=s.audio;$('count').textContent=`${active+1} / ${scenes.length}`;$('prev').disabled=active===0;$('next').disabled=active===scenes.length-1;[...$('thumbs').children].forEach((b,i)=>b.setAttribute('aria-current',String(i===active)))}function select(i){location.hash=`scene-${i+1}`} $('prev').onclick=()=>select(active-1);$('next').onclick=()=>select(active+1);window.addEventListener('hashchange',render);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight'&&active<scenes.length-1){e.preventDefault();select(active+1)}if(e.key==='ArrowLeft'&&active>0){e.preventDefault();select(active-1)}});render();</script></html>
