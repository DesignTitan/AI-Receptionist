<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A life beyond the next ring — scenes</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#1e3a34;font:16px system-ui}header{padding:25px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce6e0}h1{font-size:22px;margin:0}header small{display:block;color:#637e73;margin-top:5px}main{max-width:1500px;margin:auto;padding:26px 4vw}#hero{width:100%;aspect-ratio:16/9;object-fit:contain;background:#132b22}nav{display:flex;gap:10px;align-items:center;margin:20px 0}button,a{font:inherit;color:inherit}button{padding:10px 18px;border:1px solid #cddbd3;border-radius:30px;background:white;cursor:pointer}button:hover,button[aria-current=true]{background:#1e3a34;color:white}#count{margin:auto}#thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:25px 0}#thumbs button{padding:0;overflow:hidden;border-radius:10px;text-align:left}#thumbs img{width:100%;display:block}#thumbs span{display:block;padding:8px;font-size:12px}#notes{display:grid;grid-template-columns:1fr 1fr;gap:35px;line-height:1.6;border-top:1px solid #dce6e0;padding-top:20px}h2{font-size:25px;margin:0 0 8px}h3{font-size:12px;letter-spacing:1px;text-transform:uppercase}#audio{white-space:pre-line}a{font-size:13px}@media(max-width:700px){#thumbs{grid-template-columns:repeat(3,1fr)}#notes{grid-template-columns:1fr}header{align-items:start;gap:12px}}:focus-visible{outline:3px solid #5c9d83;outline-offset:3px}</style><header><div><h1>A life beyond the next ring.</h1><small>Approved character reference · corrected dogs · 12 scenes</small></div><a href="script.md">Full script ↗</a></header><main><img id="hero" alt=""><nav><button id="prev" aria-label="Previous scene">← Previous</button><span id="count" aria-live="polite"></span><button id="next" aria-label="Next scene">Next →</button><a id="download" download>Save image ↓</a></nav><div id="notes"><div><h2 id="title"></h2><p id="action"></p></div><div><h3>Dialogue / audio</h3><p id="audio"></p></div></div><div id="thumbs"></div></main><script>const scenes=[{"number": 1, "title": "Meet the customer in her hands", "time": "00\u201304", "image": "scene-01.png", "action": "Open on the beautiful Samoyed\u2019s whole face: upright ears, a goofy natural grin. The groomer is already washing him with both hands.", "audio": "Water and gentle room tone. The phone begins to ring.", "graphics": "Tiny AI Receptionist brand mark. No large overlay."}, {"number": 2, "title": "Both hands. One very good dog.", "time": "04\u201309", "image": "scene-02.png", "action": "The Samoyed tilts his head as her soapy hands work through his coat. Stay in the present. She has not stopped grooming.", "audio": "NARRATOR: \u201cIt always rings when your hands are full.\u201d", "graphics": "Natural little dog movement, no cartoon sound effects."}, {"number": 3, "title": "She hears it. She can\u2019t pick up.", "time": "09\u201314", "image": "scene-03.png", "action": "She glances at the ringing phone on the dry counter. Both hands stay wet and occupied with the dog; she returns her attention to him.", "audio": "NARRATOR: \u201cAnd there\u2019s someone on the other end who needs you, too.\u201d", "graphics": "Small incoming-call glass pill. No attempted reach for the phone."}, {"number": 4, "title": "Milo could use a little help", "time": "14\u201319", "image": "scene-04.png", "action": "Milo sits beside his customer, with the wild-haired reference guiding his appearance. She calls the groomer.", "audio": "CUSTOMER, affectionately to Milo: \u201cWe\u2019re getting you a haircut.\u201d\nA short ringback.", "graphics": "Let the real-looking dog supply the humor; no gag text."}, {"number": 5, "title": "A reassuring answer", "time": "19\u201325", "image": "scene-05.png", "action": "The open-eyed mascot answers beside the studio scene. The groomer stays quiet and keeps washing; the AI is speaking to the caller.", "audio": "AI: \u201cHi, Happy Paws Grooming. How can I help?\u201d", "graphics": "\u201cAI Receptionist\u201d remains visible on the small glass overlay. Happy Paws Grooming is a fictional demo name."}, {"number": 6, "title": "A specific request", "time": "25\u201332", "image": "scene-06.png", "action": "Cut to the same caller, speaking naturally. Milo stays off-screen rather than changing appearance.", "audio": "CUSTOMER: \u201cCould I book Milo for his usual groom on Thursday? After lunch would be ideal.\u201d", "graphics": "One short caption at a time. Returning-customer example; details established off-screen."}, {"number": 7, "title": "An answer that fits", "time": "32\u201339", "image": "scene-07.png", "action": "The AI presents a suitable available afternoon slot. Keep the owner visible in the background; this happens alongside her work.", "audio": "AI: \u201cThere\u2019s a two o\u2019clock appointment available on Thursday. Would you like that one?\u201d", "graphics": "Highlight \u201cThursday \u00b7 2 PM\u201d; do not make the caller navigate the interface."}, {"number": 8, "title": "The customer chooses", "time": "39\u201344", "image": "scene-08.png", "action": "The same caller smiles as she accepts the offered appointment.", "audio": "CUSTOMER: \u201cTwo is perfect. Thank you.\u201d", "graphics": "The selected time settles gently into place. No narrator over dialogue."}, {"number": 9, "title": "Both customers taken care of", "time": "44\u201351", "image": "scene-09.png", "action": "The owner dries the dog. Beside her, the new appointment resolves into a confirmation. The two threads meet.", "audio": "AI: \u201cYou\u2019re all set. Milo is booked for Thursday at two. See you then.\u201d", "graphics": "Booking card, drawn check, three brief celebration strokes. Quiet confirmation tone."}, {"number": 10, "title": "The work is finished", "time": "51\u201357", "image": "scene-10.png", "action": "The appointment has finished. She puts away her apron, ready to leave. This is the first time her hands are free.", "audio": "NARRATOR: \u201cThe appointment\u2019s booked. One less call to return before you head out.\u201d", "graphics": "A quiet, settled booking confirmation. No new person, business or location."}, {"number": 11, "title": "Time for her plans", "time": "57\u201364", "image": "scene-11.png", "action": "Work finished, the groomer heads outside with her hiking bag.", "audio": "NARRATOR: \u201cBecause you have plans, too.\u201d\nOWNER, voice message: \u201cOn my way.\u201d", "graphics": "Door closes; music opens up. The bag appears here for the first time."}, {"number": 12, "title": "A life beyond the next ring", "time": "64\u201372", "image": "scene-12.png", "action": "The groomer meets her partner by the lake after work. She is present with her partner, phone put away. Let this shot breathe, then add the invitation.", "audio": "NARRATOR: \u201cBe there for your customers. And for yourself. Meet your AI receptionist.\u201d", "graphics": "\u201cTake your day back.\u201d \u2192 \u201cMeet your AI receptionist.\u201d Small connected-pilot note."}];let active=0;const $=id=>document.getElementById(id);function show(i){active=(i+scenes.length)%scenes.length;const s=scenes[active];$('hero').src=s.image;$('hero').alt=s.title;$('title').textContent=s.title;$('count').textContent=String(s.number).padStart(2,'0')+' / 12 · '+s.time+' seconds';$('action').textContent=s.action;$('audio').textContent=s.audio;$('download').href=s.image;document.querySelectorAll('#thumbs button').forEach((b,j)=>b.setAttribute('aria-current',j===active));history.replaceState(null,'','#scene-'+s.number)}scenes.forEach((s,i)=>{const b=document.createElement('button');const img=document.createElement('img');img.src=s.image;img.alt=s.title;const span=document.createElement('span');span.textContent=String(s.number).padStart(2,'0')+' · '+s.title;b.append(img,span);b.onclick=()=>show(i);$('thumbs').append(b)});$('prev').onclick=()=>show(active-1);$('next').onclick=()=>show(active+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(active+1);if(e.key==='ArrowLeft')show(active-1)});show(Math.max(0,Number(location.hash.replace('#scene-',''))-1));</script></html>
